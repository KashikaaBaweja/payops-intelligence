name: payops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payops}
      POSTGRES_DB: ${POSTGRES_DB:-payops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payops} -d ${POSTGRES_DB:-payops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      PAYOPS_ENVIRONMENT: ${PAYOPS_ENVIRONMENT:-local}
      PAYOPS_LOG_LEVEL: ${PAYOPS_LOG_LEVEL:-INFO}
      PAYOPS_DATABASE_URL: ${PAYOPS_DATABASE_URL:-postgresql+psycopg://payops:payops@postgres:5432/payops}
      PAYOPS_API_HOST: 0.0.0.0
      PAYOPS_API_PORT: "8000"
      PAYOPS_CORS_ORIGINS: ${PAYOPS_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      PAYOPS_JSON_LOGS: "true"
      PAYOPS_VECTOR_BACKEND: memory
      PAYOPS_CORPUS_DIR: docs/corpus
      PAYOPS_AUTO_MIGRATE: "true"
      PAYOPS_SEED_ON_START: "true"
      PAYOPS_DB_WAIT_SECONDS: "60"
    ports:
      - "${PAYOPS_PUBLISH_API:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        PAYOPS_API_PROXY: http://api:8000
    environment:
      PAYOPS_API_PROXY: http://api:8000
    ports:
      - "${PAYOPS_PUBLISH_WEB:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
