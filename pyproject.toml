[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payops-intelligence"
version = "0.1.0"
description = "Autonomous AI agent for payment operations, merchant research, and incident investigation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kashikaa Baweja" }]
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "pypdf>=5.1.0",
  "sqlalchemy>=2.0.36",
  "langgraph>=0.2.76",
  "scikit-learn>=1.5.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.36",
]

[project.scripts]
payops-api = "apps.api.main:run"
payops-seed = "apps.seed:main"
payops-ingest = "apps.ingest:main"
payops-eval = "apps.eval:main"

[tool.setuptools]
packages = [
  "payops_core",
  "payops_core.agents",
  "payops_core.data",
  "payops_core.graph",
  "payops_core.models",
  "payops_core.rag",
  "payops_core.eval",
  "payops_core.tools",
  "payops_core.ml",
  "payops_core.ledger",
  "apps",
  "apps.api",
  "apps.api.routers",
]

[tool.setuptools.package-dir]
payops_core = "packages/payops_core"
apps = "apps"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]
asyncio_mode = "auto"
addopts = "-p no:langsmith"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"apps/api/main.py" = ["E402"]
"apps/eval.py" = ["E402"]
"apps/ingest.py" = ["E402"]
"apps/seed.py" = ["E402"]
"alembic/env.py" = ["E402"]
"packages/payops_core/eval/dataset.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
mypy_path = "packages:."
files = ["packages/payops_core", "apps"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
  "payops_core.agents.*",
  "payops_core.graph.*",
  "payops_core.tools.*",
  "payops_core.data.synthetic_generator",
  "payops_core.eval.*",
]
ignore_errors = true
