[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payops-intelligence"
version = "0.1.0"
description = "Autonomous AI agent for payment operations, merchant research, and incident investigation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kashikaa Baweja" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.36",
]

[project.scripts]
payops-api = "apps.api.main:run"

[tool.setuptools]
packages = [
  "payops_core",
  "payops_core.agents",
  "payops_core.data",
  "payops_core.graph",
  "payops_core.models",
  "payops_core.rag",
  "payops_core.tools",
  "apps",
  "apps.api",
  "apps.api.routers",
]

[tool.setuptools.package-dir]
payops_core = "packages/payops_core"
apps = "apps"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"apps/api/main.py" = ["E402"]
